  <g id="extra-connections">
    <path class="path2" d="M1185,690 L1185,520 L1345,520 L1345,350 L1345,210 L1490,210"/>
    <path class="path" d="M1185,690 L1185,520 L1345,520 L1345,350 L1345,210 L1490,210"/>
  </g>

  <g id="locks-and-rewards">
    <circle cx="705" cy="610" r="18" class="lock"/>
    <text x="697" y="615" class="tiny">1</text>
    <text x="731" y="616" class="note">Sword opens the hub</text>
    <circle cx="1030" cy="610" r="18" class="lock"/>
    <text x="1022" y="615" class="tiny">2</text>
    <text x="1055" y="616" class="note">Knight + Bishop keys open Queen route</text>
    <circle cx="1248" cy="588" r="18" class="lock"/>
    <text x="1240" y="593" class="tiny">3</text>
    <text x="1274" y="594" class="note">Queen unlocks Black Castle</text>
  </g>

  <g id="legend">
    <rect x="80" y="160" width="410" height="160" rx="10" fill="#211923" stroke="#5f5040" stroke-width="2"/>
    <text x="105" y="195" class="zone">LEGEND</text>
    <rect x="105" y="220" width="28" height="20" rx="4" fill="#47635f" stroke="#f2d77e" stroke-width="3"/>
    <text x="150" y="236" class="small">Hub / story room</text>
    <rect x="105" y="252" width="28" height="20" rx="4" fill="#965744" stroke="#e7d5b5" stroke-width="3"/>
    <text x="150" y="268" class="small">Combat room</text>
    <rect x="105" y="284" width="28" height="20" rx="4" fill="#904f7c" stroke="#ffca68" stroke-width="3"/>
    <text x="150" y="300" class="small">Boss / major test</text>
    <text x="300" y="236" class="small">Gold circles = locks</text>
    <text x="300" y="268" class="small">Thick paths = exits</text>
    <text x="300" y="300" class="small">Rooms become .tscn scenes</text>
  </g>

  <g id="footer">
    <text x="80" y="955" class="subtitle">Build order: T1 -> T2 -> T3 -> H1, then one district at a time. Every box is an editable Godot room scene.</text>
  </g>
</svg>
