<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2430" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#130f18"/>
      <stop offset="0.52" stop-color="#1b141f"/>
      <stop offset="1" stop-color="#0c0b10"/>
    </linearGradient>
    <style>
      .title { font-family: "Avenir Next", "Inter", Arial, sans-serif; font-size: 42px; font-weight: 800; fill: #f4dfbf; letter-spacing: 2px; }
      .subtitle { font-family: "Avenir Next", "Inter", Arial, sans-serif; font-size: 19px; font-weight: 600; fill: #a9957c; }
      .zone { font-family: "Avenir Next", "Inter", Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #efe0c7; letter-spacing: 1px; }
      .small { font-family: "Avenir Next", "Inter", Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #d7c3a2; }
      .tiny { font-family: "Avenir Next", "Inter", Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #f8edda; }
      .room-title { font-family: "Avenir Next", "Inter", Arial, sans-serif; font-size: 16px; font-weight: 800; fill: #fff2d5; }
      .room-sub { font-family: "Avenir Next", "Inter", Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #37291e; }
      .path { fill: none; stroke: #a78a5e; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; opacity: 0.92; }
      .path2 { fill: none; stroke: #2d2028; stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; opacity: 1; }
      .lock { fill: #f1c15f; stroke: #2e2317; stroke-width: 4; }
      .note { font-family: "Avenir Next", "Inter", Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #f2d7a4; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)" opacity="0.55"/>

  <text x="80" y="80" class="title">THE UNBOUND PAWN - WORLD MAP</text>
  <text x="83" y="113" class="subtitle">Connected room blueprint for the 2-hour playground kingdom adventure</text>

  <g opacity="0.2">
    <rect x="1020" y="96" width="420" height="150" rx="8" fill="#51411f"/>
    <text x="1040" y="132" class="zone">THE CHILD'S DESK</text>
    <text x="1040" y="160" class="small">The fourth wall lives here: crayons, paper gates,</text>
    <text x="1040" y="184" class="small">moved toy blocks, erased rules, drawn bridges.</text>
  </g>

  <g id="paths">
    <path class="path2" d="M225,690 L385,690 L545,690 L705,690 L865,690 L1025,690 L1185,690 L1345,690"/>
    <path class="path" d="M225,690 L385,690 L545,690 L705,690 L865,690 L1025,690 L1185,690 L1345,690"/>
    <path class="path2" d="M545,690 L545,830"/>
    <path class="path" d="M545,690 L545,830"/>
    <path class="path2" d="M705,690 L705,520 L865,520 L1025,520 L1185,520"/>
    <path class="path" d="M705,690 L705,520 L865,520 L1025,520 L1185,520"/>
    <path class="path2" d="M705,690 L705,850 L865,850 L1025,850"/>
    <path class="path" d="M705,690 L705,850 L865,850 L1025,850"/>
    <path class="path2" d="M705,520 L705,350 L865,350 L1025,350 L1185,350"/>
    <path class="path" d="M705,520 L705,350 L865,350 L1025,350 L1185,350"/>
    <path class="path2" d="M1025,520 L1025,350"/>
    <path class="path" d="M1025,520 L1025,350"/>
  </g>

  <g id="zone-labels">
    <text x="155" y="610" class="zone">FALLEN BOARD FIELD</text>
    <text x="635" y="615" class="zone">BROKEN PLAZA HUB</text>
    <text x="760" y="447" class="zone">TOYBOX CAVALRY YARD</text>
    <text x="760" y="280" class="zone">BOOK FORT CHAPEL</text>
    <text x="760" y="775" class="zone">BLOCK TOWER RAMPARTS</text>
    <text x="1085" y="447" class="zone">DOLLHOUSE COURT</text>
    <text x="1210" y="615" class="zone">BLACK CASTLE</text>
  </g>

