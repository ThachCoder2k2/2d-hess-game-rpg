    <g transform="translate(645 640)">
      <rect width="120" height="100" rx="8" fill="#47635f" stroke="#f2d77e" stroke-width="5"/>
      <text x="18" y="38" class="room-title">H1</text>
      <text x="18" y="61" class="room-sub">BROKEN PLAZA</text>
    </g>
    <g transform="translate(485 780)">
      <rect width="120" height="100" rx="8" fill="#80613a" stroke="#e7d5b5" stroke-width="4"/>
      <text x="18" y="38" class="room-title">O1</text>
      <text x="18" y="61" class="room-sub">CRAYON CACHE</text>
    </g>

    <g transform="translate(645 470)">
      <rect width="120" height="100" rx="8" fill="#47635f" stroke="#f2d77e" stroke-width="5"/>
      <text x="18" y="38" class="room-title">H2</text>
      <text x="18" y="61" class="room-sub">DRAWING TABLE</text>
    </g>
    <g transform="translate(805 470)">
      <rect width="120" height="100" rx="8" fill="#485a86" stroke="#e7d5b5" stroke-width="4"/>
      <text x="18" y="38" class="room-title">K1</text>
      <text x="18" y="61" class="room-sub">TOYBOX GATE</text>
