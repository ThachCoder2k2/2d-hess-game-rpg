    <g transform="translate(1285 300)">
      <rect width="120" height="100" rx="8" fill="#3c3139" stroke="#d6b066" stroke-width="5"/>
      <text x="18" y="38" class="room-title">F1</text>
      <text x="18" y="61" class="room-sub">CASTLE GATE</text>
